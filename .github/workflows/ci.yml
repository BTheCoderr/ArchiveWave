name: Verify ArchiveWave
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify audio test prerequisites
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Run Python tests including synthetic audio edit
        run: python3 -m unittest discover -s tests -v
